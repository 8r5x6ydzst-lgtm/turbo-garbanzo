<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>لعبة حماة البيئة</title>

<style>

body{
    font-family: Arial;
    background: linear-gradient(to right, #4CAF50, #8BC34A);
    text-align:center;
    direction:rtl;
}

#gameContainer{
    background:white;
    width: 55%;
    margin: 30px auto;
    padding: 18px;
    border-radius: 5px;
    box-shadow:0 0 15px rgba(0,0,0,0.3);
    padding-top: 40px;
    padding-right: 8px;
    padding-left: 8px;
}

button{
    width: 80%;
    padding: 10px;
    margin: 8px;
    font-size:27.5px;
    border:none;
    border-radius: 28px;
    cursor:pointer;
    background:#4CAF50;
    color:white;
    transition: all 0.3s ease; /* إضافة سلاسة في تغيير الألوان */
}

button:hover:not(:disabled){
    background:#388E3C;
}

/* التنسيق الجديد للأزرار المقفولة (اللون الرمادي) */
button:disabled {
    background-color: #d3d3d3 !important;
    color: #888 !important;
    cursor: not-allowed;
    opacity: 0.6;
}

/* تنسيق خاص للزر الخاطئ الذي اختاره المستخدم لتمييزه */
.wrong-choice {
    background-color: #f44336 !important;
    color: white !important;
}

#message{
    font-size:20px;
    margin-top:15px;
    font-weight:bold;
}

.hidden{
    display:none;
}
div{
    font-size: 40px;
}
h1{
    font-size: 60px;
}
h3{
    font-size: 45px;
}
img{
  width: 470px;
  border: 10px solid black;
  margin-top: 15px;
  border-radius: 50px;
  object-fit: cover;
}
.but{
	color: black;
}
#hud{
    background-color: #FFFFFF;
    width: 15%;
    margin: 0 auto;
    border-radius: 10px;
}

</style>
</head>

<body>
<h1>🌿 لعبة حماة البيئة 🌿</h1>
<h3 id="levelTitle">المستوى 1</h3>
<div id="hud">
    💎 <span id="gems">0</span>
</div>

<div id="gameContainer">
<button class="exit-btn" onclick="exitGame()">خروج</button>


    <img id="questionImage" src="" width="300">

    <p id="questionText"></p>

    <div id="answers"></div>

    <div style="font-size: 35px;" id="message"></div>
    
    <div style="margin-top: 35px;" id="videoContainer" class="hidden">
        <video style="border: 4px solid black; object-fit: cover;" width="500px" height="375"
        controls>
            <source id="videoSource" src="" type="">
        </video>
        <div style="margin-top: 20px;">
        <button onclick="retry()">حاول مرة أخرى</button>
        </div>
    </div>

</div>

<script>
let currentGems = 0;

function addGems() {
    currentGems += 10;
    document.getElementById("gems").innerText = currentGems;
}

const levels = [
{

image:"IMG_2038.jpeg",
video:"1771267148.mp4",
videoType:"",
answers:[
{ text:"أساعده في رمي المزيد", correct:false },
{ text:"أتجاهل الأمر", correct:false },
{ text:"أنصحه بعدم رمي القمامة وأخبر الكبار", correct:true },
{ text:"أرمي زجاجة بلاستيك أيضًا", correct:false }
]
},
{
question:"أين يجب أن نرمي القمامة؟",
image:"IMG_2039.jpeg",
video:"1771267148.mp4",
videoType:"",
answers:[
    { text:"في سلة المهملات", correct:true },
{ text:"في البحر", correct:false },
{ text:"في الشارع", correct:false },
{ text:"خلف الأشجار", correct:false }
]
},
{
question:"لماذا لا يجب قطع الأشجار بدون سبب؟",
image:"IMG_2040.jpeg",
video:"1771267148.mp4",
videoType:"",
answers:[
    { text:"لأنها قبيحة المنظر", correct:false },
{ text:"لأنها لا فائدة منها", correct:false },
{ text:"لأنها مزعجة", correct:false },
{ text:"لأنها تعطينا هواءً نظيفًا", correct:true },
]
},
{
question:"عند غسل يديك، ماذا تفعل؟",
image:"IMG_2042.jpeg",
video:"1771267148.mp4",
videoType:"",
answers:[
{ text:"أترك الماء مفتوحًا", correct:false },
{ text:"أغلق الماء بعد الانتهاء", correct:true },
{ text:"ألعب بالماء", correct:false },
{ text:"أفتح الماء أكثر", correct:false }
]
},
{
question:"عند مغادرة الغرفة، ماذا تفعل؟",
image:"IMG_2043.jpeg",
video:"1771267148.mp4",
videoType:"",
answers:[
{ text:"أترك الأنوار مضاءة", correct:false },
{ text:"أطفئ الأنوار", correct:true },
{ text:"أشغل جميع الأنوار", correct:false },
{ text:"لا أهتم", correct:false }
]
},
{
question:"كيف نقلل من تلوث الهواء؟",
image:"IMG_2254.png",
video:"1771267148.mp4",
videoType:"",
answers:[
{ text:"نحرق النفايات", correct:false },
{ text:"نشغل السيارات دائمًا", correct:false },
{ text:"نستخدم الدراجة أو المشي أحيانًا", correct:true },
{ text:"نزيد المصانع", correct:false }
]
},
{
question:"ماذا نفعل بالعلب البلاستيكية؟",
image:"IMG_2057.jpeg",
video:"1771267148.mp4",
videoType:"",
answers:[
    { text:"نعيد تدويرها", correct:true },
{ text:"نرميها في البحر", correct:false },
{ text:"نحرقها", correct:false },
{ text:"نكسرها ونرميها", correct:false }
]
},
{
question:"كيف نحمي الحيوانات؟",
image:"IMG_2046.jpeg",
video:"1771267148.mp4",
videoType:"",
answers:[
{ text:"نصطادها دائمًا", correct:false },

{ text:"نلوث الغابة", correct:false },
{ text:"نرمي القمامة في أماكنها", correct:false },
{ text:"نحافظ على بيئتها", correct:true }
]
},
{
question:"كيف نقلل من التلوث الضوضائي؟",
image:"IMG_2048.jpeg",
video:"1771267148.mp4",
videoType:"",
answers:[
{ text:"نرفع الصوت جدًا", correct:false },
{ text:"نستخدم أصوات معتدلة", correct:true },
{ text:"نصرخ في الشارع", correct:false },
{ text:"نشغل مكبرات الصوت دائمًا", correct:false }
]
},
{
question:"ماذا يعني أن أكون صديقًا للبيئة؟",
image:"IMG_2044.jpeg",
video:"1771267148.mp4",
videoType:"",
answers:[
{ text:"أحافظ على نظافتها", correct:true },
{ text:"ألوثها", correct:false },
{ text:"أقطع الأشجار", correct:false },
{ text:"أهدر الماء", correct:false }
]
}
];

let currentLevel = 0;

function loadLevel(){
    document.getElementById("videoContainer").classList.add("hidden");
    document.getElementById("message").innerHTML="";
    document.getElementById("levelTitle").innerText="المستوى " + (currentLevel+1);

    const level = levels[currentLevel];

    document.getElementById("questionText").innerText = level.question;
    document.getElementById("questionImage").src = level.image;

    const answersDiv = document.getElementById("answers");
    answersDiv.innerHTML="";

    level.answers.forEach(answer=>{
        const btn = document.createElement("button");
        btn.innerText = answer.text;
        // قمنا بتمرير الزر نفسه (this) للدالة للتحكم به
        btn.onclick = (e)=>checkAnswer(answer.correct, e.target);
        answersDiv.appendChild(btn);
    });
}

function checkAnswer(correct, clickedButton){
    if(correct){
        addGems();
        document.getElementById("message").innerHTML="🎉 أحسنت! تم اجتياز المستوى";
        currentLevel++;
        
        // قفل جميع الأزرار عند الإجابة الصحيحة أيضاً لمنع التكرار
        disableAllButtons();

        if(currentLevel < levels.length){
            setTimeout(loadLevel, 2000);
        } else {
            localStorage.setItem("userGems", currentGems);
            document.getElementById("message").innerHTML="🏆 مبروك! أنهيت جميع المستويات..";
            setTimeout(function(){
                window.location.href = 'cbv.html'; 
            }, 2000); 
        }
    } else {
        // إذا كانت الإجابة خاطئة
        clickedButton.classList.add("wrong-choice"); // تلوين الزر المختار بالأحمر
        disableOtherButtons(clickedButton); // قفل الباقي بالرمادي

        const level = levels[currentLevel];
        document.getElementById("videoSource").src = level.video;
        document.getElementById("videoSource").type = level.videoType;
        document.querySelector("video").load();
        document.getElementById("videoContainer").classList.remove("hidden");
    }
}

// وظيفة لقفل باقي الأزرار ما عدا الذي ضغط عليه المستخدم
function disableOtherButtons(exceptionBtn) {
    const buttons = document.querySelectorAll("#answers button");
    buttons.forEach(btn => {
        if(btn !== exceptionBtn) {
            btn.disabled = true;
            btn.classList.add("disabled");
        }
    });
}

// وظيفة لقفل جميع الأزرار (تستخدم عند الإجابة الصحيحة)
function disableAllButtons() {
    const buttons = document.querySelectorAll("#answers button");
    buttons.forEach(btn => {
        btn.disabled = true;
    });
}

function retry(){
    document.getElementById("videoContainer").classList.add("hidden");
    document.querySelector("video").pause();
    // إعادة تحميل المستوى لإتاحة المحاولة مرة أخرى
    loadLevel();
}

loadLevel();
</script>
</body>
</html>
